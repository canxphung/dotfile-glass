name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cài công cụ kiểm tra
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck lua5.4 desktop-file-utils

      - name: make check
        run: make check LUA=lua5.4 LUAC=luac5.4
