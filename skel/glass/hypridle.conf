# ~/.config/glass/hypridle.conf — file của bạn, Glass không ghi đè.
#
# Thời gian chờ (giảm sáng, khoá, tắt màn hình, ngủ) chỉnh trong
# ~/.config/glass/settings.toml, mục [idle], hoặc bằng lệnh:
#   glassctl set idle.lock 600
source = @GLASS_DATADIR@/hypr/hypridle.conf

# Thêm listener riêng bên dưới, ví dụ tắt đèn bàn phím sau 2 phút:
# listener {
#     timeout = 120
#     on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
#     on-resume = brightnessctl -rd rgb:kbd_backlight
# }
