# ~/.config/glass/hypridle.conf — file của bạn, Glass không ghi đè.
#
# Thời gian chờ tính bằng giây. Sửa xong thì chạy:
#   systemctl --user restart glass-idle
$dim_timeout        = 150
$lock_timeout       = 300
$screen_off_timeout = 330
$suspend_timeout    = 1800

source = @GLASS_DATADIR@/hypr/hypridle.conf
