# Kitty theo phong cách Glass (Aero Sky).
# Do gói quản lý; chỉnh riêng trong ~/.config/kitty/kitty.conf.

font_family      JetBrainsMono Nerd Font
font_size        11.0

# Nền trong suốt để Hyprland blur phía sau; chữ vẫn rõ nét.
background_opacity         0.82
dynamic_background_opacity yes

window_padding_width    10
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell       no
cursor_shape            beam

tab_bar_edge        top
tab_bar_style       powerline
tab_powerline_style slanted

# Màu (từ theme/palettes/sky.toml)
foreground           #dce9f7
background           #0c1726
selection_foreground #f4f9ff
selection_background #2b5c8f
cursor               #8fd3ff
cursor_text_color    #0c1726
url_color            #8fd3ff

active_border_color   #74b8fc
inactive_border_color #3a5270

active_tab_foreground   #0b1a2b
active_tab_background   #8fd3ff
inactive_tab_foreground #8aa4c0
inactive_tab_background #13233a

color0  #13233a
color1  #e5534b
color2  #6cc070
color3  #e8c46a
color4  #4da3f0
color5  #b58cf0
color6  #4fd1d9
color7  #c9d7e6
color8  #3a5270
color9  #ff7b72
color10 #8edc8f
color11 #f5d98b
color12 #8fd3ff
color13 #d0b3ff
color14 #8be9f0
color15 #f4f9ff
