# Hình nền. Do gói quản lý.
#
# Đổi hình nền trong ~/.config/glass/settings.toml, mục [wallpaper], hoặc:
#   glassctl wallpaper ~/Pictures/hinh-nen.jpg
# glassd ghi khối wallpaper vào ~/.local/state/glass/wallpaper.conf và đổi
# hình ngay qua IPC của hyprpaper.

splash = false
ipc = true

source = ~/.local/state/glass/wallpaper.conf
