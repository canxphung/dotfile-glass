# Hình nền mặc định. Do gói quản lý.
# Đổi hình nền trong ~/.config/glass/hyprpaper.conf, hoặc tạm thời:
#   hyprctl hyprpaper wallpaper ', /đường/dẫn/hình.jpg, cover'

splash = false
ipc = true

# monitor để trống: áp cho mọi màn hình chưa có hình riêng.
wallpaper {
    monitor =
    path = @GLASS_DATADIR@/wallpapers/aero-sky.jpg
    fit_mode = cover
}
