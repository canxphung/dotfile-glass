# Màn hình khoá Glass (Aero Sky).
# Do gói quản lý; chỉnh riêng trong ~/.config/glass/hyprlock.conf
# (file đó source file này trước).
#
# Lưu ý cú pháp hyprlang: "#" mở đầu comment, muốn viết ký tự # thì gõ "##".

$glass_font  = Selawik, Noto Sans
$glass_text  = rgba(eaf4ffff)
$glass_muted = rgba(8aa4c0ff)
$glass_frame = rgba(cfeaffcc) rgba(3a7fd099) 90deg

general {
    hide_cursor = false
    ignore_empty_input = true
}

auth {
    # Bật trong file của bạn nếu máy có đầu đọc vân tay (fprintd).
    fingerprint:enabled = false
}

animations {
    enabled = true
}

bezier = aero, 0.22, 1, 0.36, 1
animation = fadeIn, 1, 3, aero
animation = fadeOut, 1, 2, aero
animation = inputFieldDots, 1, 2, aero

# Nền: ảnh chụp desktop, làm mờ như nhìn qua kính.
background {
    monitor =
    path = screenshot
    color = rgba(0c1726ff)
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    brightness = 0.75
    vibrancy = 0.25
}

# Tấm kính ở giữa.
shape {
    monitor =
    size = 440, 320
    color = rgba(74b8fc2e)
    rounding = 14
    border_size = 2
    border_color = $glass_frame
    shadow_passes = 2
    shadow_size = 12
    shadow_color = rgba(0a1a2e99)
    position = 0, -60
    halign = center
    valign = center
}

# Giờ
label {
    monitor =
    text = $TIME
    color = $glass_text
    font_size = 76
    font_family = $glass_font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0a1a2eaa)
    position = 0, 240
    halign = center
    valign = center
}

# Ngày
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d/%m/%Y"
    color = $glass_text
    font_size = 18
    font_family = $glass_font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0a1a2eaa)
    position = 0, 165
    halign = center
    valign = center
}

# Tên người dùng
label {
    monitor =
    text = $USER
    color = $glass_text
    font_size = 22
    font_family = $glass_font
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 10
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = $glass_frame
    inner_color = rgba(0c1726aa)
    font_color = $glass_text
    font_family = $glass_font
    fade_on_empty = false
    placeholder_text = <span foreground="##8aa4c0">Mật khẩu</span>
    check_color = rgba(8fd3ffee) rgba(2b8ce6ee) 90deg
    fail_color = rgba(e5534bee) rgba(ff7b72ee) 90deg
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgba(e8c46aee)
    position = 0, -80
    halign = center
    valign = center
}

# Gợi ý dưới ô mật khẩu
label {
    monitor =
    text = Nhấn Enter để mở khoá
    color = $glass_muted
    font_size = 12
    font_family = $glass_font
    position = 0, -140
    halign = center
    valign = center
}
