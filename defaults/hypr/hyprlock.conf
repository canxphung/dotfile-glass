# Màn hình khoá Glass (Aero Sky).
# Do gói quản lý; chỉnh riêng trong ~/.config/glass/hyprlock.conf
# (file đó source file này trước).
#
# Lưu ý cú pháp hyprlang: "#" mở đầu comment, muốn viết ký tự # thì gõ "##".

# Màu và font ($glass_*) do glassd sinh theo palette đang chọn.
source = ~/.local/state/glass/theme/hyprlock.conf

general {
    hide_cursor = false
    ignore_empty_input = true
}

auth {
    # Bật trong file của bạn nếu máy có đầu đọc vân tay (fprintd).
    fingerprint:enabled = false
}

animations {
    enabled = true
}

bezier = aero, 0.22, 1, 0.36, 1
animation = fadeIn, 1, 3, aero
animation = fadeOut, 1, 2, aero
animation = inputFieldDots, 1, 2, aero

# Nền: ảnh chụp desktop, làm mờ như nhìn qua kính.
background {
    monitor =
    path = screenshot
    color = $glass_bg
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    brightness = 0.75
    vibrancy = 0.25
}

# Tấm kính ở giữa.
shape {
    monitor =
    size = 440, 320
    color = $glass_card
    rounding = 14
    border_size = 2
    border_color = $glass_frame
    shadow_passes = 2
    shadow_size = 12
    shadow_color = $glass_shadow
    position = 0, -60
    halign = center
    valign = center
}

# Giờ
label {
    monitor =
    text = $TIME
    color = $glass_text
    font_size = 76
    font_family = $glass_font
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $glass_text_shadow
    position = 0, 240
    halign = center
    valign = center
}

# Ngày
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d/%m/%Y"
    color = $glass_text
    font_size = 18
    font_family = $glass_font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = $glass_text_shadow
    position = 0, 165
    halign = center
    valign = center
}

# Tên người dùng
label {
    monitor =
    text = $USER
    color = $glass_text
    font_size = 22
    font_family = $glass_font
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    rounding = 10
    dots_size = 0.2
    dots_spacing = 0.3
    outer_color = $glass_frame
    inner_color = $glass_inner
    font_color = $glass_text
    font_family = $glass_font
    fade_on_empty = false
    placeholder_text = <i>Mật khẩu</i>
    check_color = $glass_check
    fail_color = $glass_fail
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $glass_caps
    position = 0, -80
    halign = center
    valign = center
}

# Gợi ý dưới ô mật khẩu
label {
    monitor =
    text = Nhấn Enter để mở khoá
    color = $glass_muted
    font_size = 12
    font_family = $glass_font
    position = 0, -140
    halign = center
    valign = center
}
