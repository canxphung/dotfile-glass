# Hành vi khi máy rảnh. Do gói quản lý.
#
# Thời gian chờ chỉnh trong ~/.config/glass/settings.toml, mục [idle]
# (hoặc: glassctl set idle.lock 600). glassd sinh các listener tương ứng
# vào ~/.local/state/glass/idle.conf.

general {
    # Chỉ một hyprlock chạy một lúc. glass-session gọi hyprlock với
    # config ~/.config/glass/hyprlock.conf.
    lock_cmd = pidof hyprlock || glass-session lock-screen
    # Khoá trước khi ngủ (mọi đường: nút nguồn, gập máy, hẹn giờ).
    before_sleep_cmd = loginctl lock-session
    # Bật lại màn hình ngay khi thức dậy.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

source = ~/.local/state/glass/idle.conf
