# Hành vi khi máy rảnh.
# Do gói quản lý. Thời gian chờ ($dim_timeout, $lock_timeout,
# $screen_off_timeout, $suspend_timeout) được khai báo trong
# ~/.config/glass/hypridle.conf trước khi source file này.

general {
    # Chỉ một hyprlock chạy một lúc. glass-session gọi hyprlock với
    # config ~/.config/glass/hyprlock.conf.
    lock_cmd = pidof hyprlock || glass-session lock-screen
    # Khoá trước khi ngủ (mọi đường: nút nguồn, gập máy, hẹn giờ).
    before_sleep_cmd = loginctl lock-session
    # Bật lại màn hình ngay khi thức dậy.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Giảm độ sáng
listener {
    timeout = $dim_timeout
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Khoá máy
listener {
    timeout = $lock_timeout
    on-timeout = loginctl lock-session
}

# Tắt màn hình
listener {
    timeout = $screen_off_timeout
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

# Ngủ
listener {
    timeout = $suspend_timeout
    on-timeout = systemctl suspend
}
