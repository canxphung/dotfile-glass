# Cấu hình SDDM của Glass. Cài vào /usr/lib/sddm/sddm.conf.d/.
#
# SDDM đọc theo thứ tự: /usr/lib/sddm/sddm.conf.d/* (theo bảng chữ cái),
# rồi /etc/sddm.conf.d/*, rồi /etc/sddm.conf; file đọc sau thắng.
# Tên "glass.conf" xếp sau "default.conf" của gói sddm nên đè được nó,
# còn cấu hình của bạn trong /etc vẫn đè được file này.
#
# Greeter chạy trên Wayland qua weston. Nếu máy gặp lỗi (hay gặp với
# NVIDIA), tạo /etc/sddm.conf.d/glass-x11.conf với nội dung:
#   [General]
#   DisplayServer=x11

[General]
DisplayServer=wayland

[Wayland]
CompositorCommand=weston --shell=kiosk
