# Chọn backend portal cho phiên có XDG_CURRENT_DESKTOP=Hyprland.
# Cài vào /etc/xdg/xdg-desktop-portal/, được ưu tiên hơn file mặc định
# mà xdg-desktop-portal-hyprland cài trong /usr/share.
#
#   hyprland       chụp/quay màn hình, phím tắt toàn cục
#   gtk            chọn file, sáng/tối cho app (đọc từ gsettings)
#   gnome-keyring  lưu mật khẩu cho app Flatpak (Secret)

[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
